services:
  instareader:
    build: .
    container_name: instareader
    restart: unless-stopped
    env_file: .env
    environment:
      DATA_DIR: /data
      IG_COOKIES: /cookies/cookies.txt
    volumes:
      - ./data:/data              # SQLite cache + Whisper model download (kept across rebuilds)
      - ./cookies:/cookies:ro     # put cookies.txt here
    ports:
      # Open on the VPS's public IP so the web page works from your browser: http://<vps-ip>:8080
      # Every API call needs HTTP_TOKEN. For localhost-only, change to "127.0.0.1:8080:8080".
      - "8080:8080"
    logging:
      driver: json-file
      options: { max-size: "10m", max-file: "3" }
